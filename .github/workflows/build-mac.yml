name: Build Mac App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app bundles
        run: npm run build

      - name: Package universal dmg (unsigned)
        run: npx electron-builder --mac dmg --universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Rename artifact to a stable name
        run: mv dist/MeetingNotes-*.dmg dist/MeetingNotes.dmg

      - name: Publish to the desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: MeetingNotes for Mac
          make_latest: true
          body: |
            MeetingNotes desktop app for macOS (universal — Apple Silicon + Intel).

            **Install:** download `MeetingNotes.dmg`, open it, and drag MeetingNotes to Applications.

            **First launch (unsigned build):** macOS will block the app the first time.
            Open **System Settings → Privacy & Security**, scroll down, and click
            **Open Anyway** next to MeetingNotes. You only do this once.
          files: desktop/dist/MeetingNotes.dmg
